<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobDhund</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    background:#e9ecef;
    color:#333;
    padding-bottom:75px;
}

header{
    background:#0056b3;
    color:#fff;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.app-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:18px;
    font-weight:bold;
}

.logo-circle{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#fff;
    color:#0056b3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
}

.header-icons{
    display:flex;
    gap:6px;
    align-items:center;
}

.icon-btn,
.lang-select{
    background:rgba(255,255,255,.2);
    color:#fff;
    border:0;
    border-radius:5px;
    padding:6px 8px;
    cursor:pointer;
    font-size:12px;
}

.lang-select option{
    color:#000;
}

.container{
    max-width:650px;
    margin:12px auto;
    padding:0 10px;
}

.disclaimer-bar{
    font-size:11px;
    color:#856404;
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:8px;
    border-radius:5px;
    margin-bottom:12px;
    text-align:center;
}

.job-card{
    background:#fff;
    border-radius:8px;
    margin-bottom:15px;
    padding:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    border:1px solid #ddd;
}

.card-top-actions{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
}

.ad-content-box{
    border:1px dashed #0056b3;
    background:#f8f9fa;
    padding:15px 10px;
    text-align:center;
    border-radius:6px;
}

.job-title{
    color:#0056b3;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.job-info{
    font-size:14px;
    color:#444;
    margin:5px 0;
}

.card-bottom-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #eee;
    flex-wrap:wrap;
}

.btn{
    padding:7px 11px;
    border:0;
    border-radius:5px;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
}

.share-btn{background:#17a2b8;color:#fff;}
.call-btn{background:#28a745;color:#fff;}
.wa-btn{background:#25d366;color:#fff;}
.reject-btn{background:#dc3545;color:#fff;}
.approve-btn{background:#007bff;color:#fff;}
.edit-btn{background:#ffc107;color:#212529;}

.bottom-cat-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#fff;
    display:flex;
    overflow-x:auto;
    border-top:2px solid #0056b3;
    box-shadow:0 -2px 5px rgba(0,0,0,.1);
    z-index:99;
}

.cat-tab{
    flex:1;
    min-width:70px;
    padding:12px 5px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:#555;
    background:none;
    border:0;
    border-bottom:3px solid transparent;
    cursor:pointer;
    white-space:nowrap;
}

.cat-tab.active{
    color:#0056b3;
    border-bottom-color:#0056b3;
    background:#f0f7ff;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.65);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal-content{
    background:#fff;
    width:100%;
    max-width:430px;
    max-height:92vh;
    overflow-y:auto;
    border-radius:9px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.modal-header{
    color:#0056b3;
    font-size:17px;
    font-weight:bold;
    margin-bottom:14px;
    padding-bottom:8px;
    border-bottom:1px solid #ddd;
}

.form-group{
    margin-bottom:11px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:4px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:9px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:13px;
}

.submit-btn,
.close-btn{
    width:100%;
    padding:10px;
    border:0;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
    margin-top:6px;
}

.submit-btn{
    background:#0056b3;
    color:#fff;
}

.close-btn{
    background:#6c757d;
    color:#fff;
}

#admin-section{
    display:none;
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.admin-title{
    color:#856404;
    font-size:15px;
    margin-bottom:10px;
}

.pending-card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:6px;
    padding:10px;
    margin-bottom:8px;
}

.empty{
    background:#fff;
    border-radius:8px;
    padding:25px;
    text-align:center;
    color:#777;
    margin-top:10px;
}

.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:10px;
    font-size:10px;
    font-weight:bold;
    background:#e7f1ff;
    color:#0056b3;
    margin-bottom:5px;
}

.admin-login-btn{
    background:none;
    border:0;
    color:#fff;
    opacity:.3;
    cursor:pointer;
    font-size:11px;
}

.owner-badge{
    background:#198754;
    color:#fff;
    border-radius:12px;
    padding:4px 8px;
    font-size:10px;
}

@media(max-width:500px){
    .app-title span{
        font-size:16px;
    }

    .header-icons{
        gap:3px;
    }

    .icon-btn{
        padding:6px;
    }

    .lang-select{
        width:62px;
    }

    .job-title{
        font-size:16px;
    }

    .btn{
        font-size:11px;
        padding:7px 9px;
    }
}
</style>
</head>

<body>

<header>

    <div class="app-title">
        <div class="logo-circle">JD</div>
        <span>JobDhund</span>
    </div>

    <div class="header-icons">

        <select class="lang-select" id="langSelect"
                onchange="changeLanguage(this.value)">
            <option value="mr">मराठी</option>
            <option value="hi">हिंदी</option>
            <option value="en">EN</option>
        </select>

        <button class="icon-btn" onclick="openLocationModal()">
            📍 <span id="loc-text">सर्व भारत</span>
        </button>

        <button class="icon-btn"
                onclick="openPostModal()">
            📄+
        </button>

        <button class="admin-login-btn"
                onclick="openAdminLogin()">
            ⚙️
        </button>

    </div>
</header>


<div class="container">

    <div class="disclaimer-bar" id="disclaimer-txt">
        Disclaimer: कृपया कोणत्याही नोकरीसाठी पैसे देण्यापूर्वी सर्व माहिती स्वतः तपासून घ्या.
    </div>


    <!-- ADMIN PANEL -->

    <div id="admin-section">

        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="admin-title">
                👑 Owner Admin Panel
            </div>

            <span class="owner-badge">
                OWNER
            </span>
        </div>

        <div id="pending-jobs"></div>

        <button class="close-btn"
                onclick="logoutAdmin()">
            Admin Logout
        </button>

    </div>


    <!-- APPROVED JOBS -->

    <div id="approved-jobs"></div>

</div>


<!-- CATEGORY BAR -->

<div class="bottom-cat-bar">

    <button class="cat-tab active"
            id="cat-all"
            onclick="filterCategory('all',this)">
        सर्व
    </button>

    <button class="cat-tab"
            id="cat-wanted"
            onclick="filterCategory('wanted',this)">
        पाहिजेत
    </button>

    <button class="cat-tab"
            id="cat-sell"
            onclick="filterCategory('sell',this)">
        विकणे
    </button>

    <button class="cat-tab"
            id="cat-rent"
            onclick="filterCategory('rent',this)">
        भाड्याने
    </button>

    <button class="cat-tab"
            id="cat-other"
            onclick="filterCategory('other',this)">
        इतर
    </button>

</div>


<!-- LOCATION MODAL -->

<div class="modal" id="locationModal">

    <div class="modal-content">

        <div class="modal-header">
            स्थान निवडा
        </div>

        <div class="form-group">

            <label>राज्य:</label>

            <select id="stateSelect"
                    onchange="loadCities()">
            </select>

        </div>

        <div class="form-group">

            <label>शहर:</label>

            <select id="citySelect">
            </select>

        </div>

        <button class="submit-btn"
                onclick="applyLocationFilter()">
            लागू करा
        </button>

        <button class="close-btn"
                onclick="closeLocationModal()">
            बंद करा
        </button>

    </div>

</div>


<!-- POST MODAL -->

<div class="modal" id="postModal">

    <div class="modal-content">

        <div class="modal-header">
            + नवीन जाहिरात पोस्ट करा
        </div>

        <form id="jobForm">

            <div class="form-group">

                <label>जाहिरात शीर्षक:</label>

                <input type="text"
                       id="title"
                       required
                       maxlength="100"
                       placeholder="उदा. ड्रायव्हर पाहिजे">

            </div>


            <div class="form-group">

                <label>कंपनी / मालकाचे नाव:</label>

                <input type="text"
                       id="company"
                       required
                       maxlength="100"
                       placeholder="उदा. साई ट्रॅव्हल्स">

            </div>


            <div class="form-group">

                <label>वर्गवारी:</label>

                <select id="category">

                    <option value="wanted">
                        पाहिजेत
                    </option>

                    <option value="sell">
                        विकणे
                    </option>

                    <option value="rent">
                        भाड्याने
                    </option>

                    <option value="other">
                        इतर
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>राज्य:</label>

                <select id="postState"
                        onchange="loadPostCities()"
                        required>
                </select>

            </div>


            <div class="form-group">

                <label>शहर:</label>

                <select id="postCity"
                        required>
                </select>

            </div>


            <div class="form-group">

                <label>मोबाईल नंबर:</label>

                <input type="tel"
                       id="phone"
                       required
                       maxlength="10"
                       pattern="[0-9]{10}"
                       placeholder="9876543210">

            </div>


            <div class="form-group">

                <label>पगार / अधिक माहिती:</label>

                <textarea id="desc"
                          rows="3"
                          maxlength="500"
                          placeholder="उदा. ₹15,000 प्रति महिना"></textarea>

            </div>


            <button type="submit"
                    class="submit-btn">
                सबमिट करा
            </button>

            <button type="button"
                    class="close-btn"
                    onclick="closePostModal()">
                रद्द करा
            </button>

        </form>

    </div>

</div>


<!-- ADMIN LOGIN MODAL -->

<div class="modal" id="adminLoginModal">

    <div class="modal-content">

        <div class="modal-header">
            🔐 Owner Login
        </div>

        <div class="form-group">

            <label>Admin Password:</label>

            <input type="password"
                   id="adminPassword"
                   placeholder="Password">

        </div>

        <button class="submit-btn"
                onclick="loginAdmin()">
            Login
        </button>

        <button class="close-btn"
                onclick="closeAdminLogin()">
            बंद करा
        </button>

    </div>

</div>


<script>

/* ==============================
   TRANSLATIONS
================================ */

const translations = {

    mr:{
        disclaimer:
        "Disclaimer: कृपया कोणत्याही नोकरीसाठी पैसे देण्यापूर्वी सर्व माहिती स्वतः तपासून घ्या.",

        all:"सर्व",
        wanted:"पाहिजेत",
        sell:"विकणे",
        rent:"भाड्याने",
        other:"इतर",

        share:"🔗 शेअर",
        call:"📞 कॉल",
        whatsapp:"💬 WhatsApp",
        delete:"🗑️ डिलीट",
        approve:"✅ मंजूर करा",

        allIndia:"सर्व भारत",
        allCities:"सर्व शहरे",

        noJobs:"सध्या कोणत्याही जाहिराती उपलब्ध नाहीत.",
        pending:"Pending जाहिराती",
        submitted:"जाहिरात सबमिट झाली आहे. Admin Approval नंतर ती Live होईल."
    },

    hi:{
        disclaimer:
        "Disclaimer: कृपया किसी भी नौकरी के लिए पैसे देने से पहले सभी जानकारी स्वयं जांच लें।",

        all:"सभी",
        wanted:"चाहिए",
        sell:"बेचना",
        rent:"किराये पर",
        other:"अन्य",

        share:"🔗 शेयर",
        call:"📞 कॉल",
        whatsapp:"💬 WhatsApp",
        delete:"🗑️ हटाएं",
        approve:"✅ मंजूर करें",

        allIndia:"पूरा भारत",
        allCities:"सभी शहर",

        noJobs:"अभी कोई विज्ञापन उपलब्ध नहीं है।",
        pending:"Pending विज्ञापन",
        submitted:"विज्ञापन सबमिट हो गया है। Admin Approval के बाद Live होगा।"
    },

    en:{
        disclaimer:
        "Disclaimer: Please verify all details independently before making any payments.",

        all:"ALL",
        wanted:"WANTED",
        sell:"SELL",
        rent:"RENT",
        other:"OTHER",

        share:"🔗 Share",
        call:"📞 Call",
        whatsapp:"💬 WhatsApp",
        delete:"🗑️ Delete",
        approve:"✅ Approve",

        allIndia:"All India",
        allCities:"All Cities",

        noJobs:"No advertisements available.",
        pending:"Pending Advertisements",
        submitted:"Advertisement submitted. It will go live after Admin Approval."
    }

};


/* ==============================
   STATE DATA
================================ */

const indiaData = {

    "Maharashtra":[
        "Mumbai",
        "Pune",
        "Nagpur",
        "Nashik",
        "Thane",
        "Aurangabad",
        "Solapur",
        "Kolhapur",
        "Satara",
        "Sangli"
    ],

    "Delhi":[
        "New Delhi",
        "North Delhi",
        "South Delhi"
    ],

    "Gujarat":[
        "Ahmedabad",
        "Surat",
        "Vadodara",
        "Rajkot"
    ],

    "Karnataka":[
        "Bengaluru",
        "Mysuru",
        "Mangaluru"
    ],

    "Uttar Pradesh":[
        "Lucknow",
        "Kanpur",
        "Varanasi",
        "Noida"
    ],

    "Madhya Pradesh":[
        "Bhopal",
        "Indore",
        "Jabalpur",
        "Gwalior"
    ],

    "Goa":[
        "Panaji",
        "Margao"
    ],

    "Rajasthan":[
        "Jaipur",
        "Jodhpur",
        "Udaipur",
        "Kota"
    ]
};


/* ==============================
   APP STATE
================================ */

let currentLang = "mr";

let selectedState = "all";
let selectedCity = "all";
let selectedCategory = "all";

let isAdminLoggedIn =
    sessionStorage.getItem("jobdhund_owner") === "true";


/*
 IMPORTANT:

 This password is ONLY for this demo frontend.

 For real production:
 use Firebase/Supabase/backend authentication.
*/

const DEMO_OWNER_PASSWORD = "1234";


/* ==============================
   INITIAL DATA
================================ */

const initialData = [

    {
        id:1,

        title:"ड्रायव्हर पाहिजे (कारसाठी)",

        company:"साई ट्रॅव्हल्स",

        category:"wanted",

        state:"Maharashtra",

        city:"Pune",

        phone:"9876543210",

        desc:"पगार ₹15,000 प्रति महिना. राहण्याची सोय आहे.",

        status:"approved",

        createdAt:Date.now()
    }

];


let jobs =
    JSON.parse(localStorage.getItem("jobDhundData"))
    || initialData;


/* ==============================
   DOM
================================ */

const approvedJobsDiv =
    document.getElementById("approved-jobs");

const pendingJobsDiv =
    document.getElementById("pending-jobs");


/* ==============================
   SAFE TEXT
================================ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==============================
   SAVE
================================ */

function saveJobs(){

    localStorage.setItem(
        "jobDhundData",
        JSON.stringify(jobs)
    );

}


/* ==============================
   LOCATION
================================ */

function initLocationData(){

    const stateSel =
        document.getElementById("stateSelect");

    const postState =
        document.getElementById("postState");

    const t =
        translations[currentLang];


    stateSel.innerHTML =
        `<option value="all">${t.allIndia}</option>`;

    postState.innerHTML =
        `<option value="">राज्य निवडा</option>`;


    Object.keys(indiaData).forEach(state=>{

        stateSel.innerHTML +=
            `<option value="${escapeHTML(state)}">
                ${escapeHTML(state)}
             </option>`;

        postState.innerHTML +=
            `<option value="${escapeHTML(state)}">
                ${escapeHTML(state)}
             </option>`;

    });


    stateSel.value = selectedState;

    loadCities();

}


/* ==============================
   FILTER CITIES
================================ */

function loadCities(){

    const state =
        document.getElementById("stateSelect").value;

    const citySel =
        document.getElementById("citySelect");

    const t =
        translations[currentLang];


    citySel.innerHTML =
        `<option value="all">${t.allCities}</option>`;


    if(indiaData[state]){

        indiaData[state].forEach(city=>{

            citySel.innerHTML +=
                `<option value="${escapeHTML(city)}">
                    ${escapeHTML(city)}
                 </option>`;

        });

    }

}


/* ==============================
   POST CITIES
================================ */

function loadPostCities(){

    const state =
        document.getElementById("postState").value;

    const citySel =
        document.getElementById("postCity");


    citySel.innerHTML =
        `<option value="">शहर निवडा</option>`;


    if(indiaData[state]){

        indiaData[state].forEach(city=>{

            citySel.innerHTML +=
                `<option value="${escapeHTML(city)}">
                    ${escapeHTML(city)}
                 </option>`;

        });

    }

}


/* ==============================
   MODALS
================================ */

function openPostModal(){

    document.getElementById("postModal")
        .style.display = "flex";

}


function closePostModal(){

    document.getElementById("postModal")
        .style.display = "none";

}


function openLocationModal(){

    document.getElementById("locationModal")
        .style.display = "flex";

}


function closeLocationModal(){

    document.getElementById("locationModal")
        .style.display = "none";

}


function openAdminLogin(){

    if(isAdminLoggedIn){

        document.getElementById("admin-section")
            .scrollIntoView({
                behavior:"smooth"
            });

        return;
    }

    document.getElementById("adminLoginModal")
        .style.display = "flex";

    setTimeout(()=>{
        document.getElementById("adminPassword").focus();
