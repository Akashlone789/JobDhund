<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobDhund - नोकरी शोधा / पोस्ट करा</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 30px; }
        
        header { background-color: #0056b3; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; }
        .logo span { color: #ffc107; }
        .admin-link { color: white; text-decoration: underline; cursor: pointer; font-size: 14px; }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-bottom: 15px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        
        .btn { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        .btn:hover { background-color: #218838; }

        .job-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #0056b3; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .job-details h3 { color: #0056b3; }
        .job-details p { color: #666; font-size: 14px; margin: 3px 0; }
        .badge { background: #e2e8f0; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        
        .call-btn { background-color: #007bff; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; }
        .approve-btn { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .reject-btn { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }

        #admin-panel { display: none; background: #fff3cd; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Job<span>Dhund</span></div>
        <div class="admin-link" onclick="toggleAdmin()">🔑 Admin Login</div>
    </header>

    <div class="container">
        <!-- १. जॉब पोस्ट करण्याचा फॉर्म -->
        <div class="card">
            <h2>+ नवीन जाहिरात/जॉब पोस्ट करा</h2>
            <form id="jobForm">
                <div class="form-group">
                    <label>नोकरीचे नाव (Job Title):</label>
                    <input type="text" id="title" required placeholder="उदा. चारचाकी ड्रायव्हर">
                </div>
                <div class="form-group">
                    <label>कंपनी/मालकाचे नाव:</label>
                    <input type="text" id="company" required placeholder="उदा. रॉयल ट्रॅव्हल्स">
                </div>
                <div class="form-group">
                    <label>जिल्हा (District):</label>
                    <select id="district">
                        <option value="पुणे">पुणे</option>
                        <option value="नाशिक">नाशिक</option>
                        <option value="नांदेड">नांदेड</option>
                        <option value="छत्रपती संभाजीनगर">छत्रपती संभाजीनगर</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>संपर्क फोन नंबर:</label>
                    <input type="tel" id="phone" required placeholder="उदा. 9876543210">
                </div>
                <div class="form-group">
                    <label>माहिती/पगार:</label>
                    <textarea id="desc" rows="2" placeholder="उदा. पगार १५,००० महिना"></textarea>
                </div>
                <button type="submit" class="btn">पोस्ट सबमिट करा (Approval नंतर लाईव्ह होईल)</button>
            </form>
        </div>

        <!-- २. एडमिन पॅनल (Admin Approval Section) -->
        <div class="card" id="admin-panel">
            <h2>🔑 Admin Panel (पेंडिंग अप्रूव्हल्स)</h2>
            <div id="pending-jobs"><p>कोणतेही नवीन पेंडिंग जॉब्स नाहीत.</p></div>
        </div>

        <!-- ३. मंजूर झालेले जॉब्स (Live Jobs) -->
        <h2>उपलब्ध नोकऱ्या (Approved Jobs)</h2>
        <div id="approved-jobs"></div>
    </div>

    <script>
        // लोकल स्टोरेजमधून डेटा घेणे
        let jobs = JSON.parse(localStorage.getItem('jobDhundData')) || [];
        let isAdminLoggedIn = false;

        const jobForm = document.getElementById('jobForm');
        const approvedJobsDiv = document.getElementById('approved-jobs');
        const pendingJobsDiv = document.getElementById('pending-jobs');

        // फॉर्म सबमिट केल्यावर जॉब Save करणे (Status: pending)
        jobForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newJob = {
                id: Date.now(),
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                district: document.getElementById('district').value,
                phone: document.getElementById('phone').value,
                desc: document.getElementById('desc').value,
                status: 'pending' // सुरुवातीला पेंडिंग राहील
            };

            jobs.push(newJob);
            localStorage.setItem('jobDhundData', JSON.stringify(jobs));
            alert('जॉब यशस्वीरित्या सबमिट झाला आहे! एडमिनच्या Approval नंतर वेबसाईटवर दिसेल.');
            jobForm.reset();
            renderJobs();
        });

        // जॉब्स स्क्रीनवर दाखवणे
        function renderJobs() {
            approvedJobsDiv.innerHTML = '';
            pendingJobsDiv.innerHTML = '';

            let hasPending = false;

            jobs.forEach(job => {
                if (job.status === 'approved') {
                    approvedJobsDiv.innerHTML += `
                        <div class="job-card">
                            <div class="job-details">
                                <h3>${job.title}</h3>
                                <p><strong>कंपनी:</strong> ${job.company}</p>
                                <p><strong>स्थान:</strong> ${job.district} | <span class="badge">${job.desc}</span></p>
                            </div>
                            <div>
                                <a href="tel:${job.phone}" class="call-btn">📞 कॉल करा</a>
                            </div>
                        </div>
                    `;
                } else if (job.status === 'pending' && isAdminLoggedIn) {
                    hasPending = true;
                    pendingJobsDiv.innerHTML += `
                        <div class="job-card" style="border-left-color: #ffc107;">
                            <div class="job-details">
                                <h3>${job.title}</h3>
                                <p><strong>कंपनी:</strong> ${job.company} | <strong>मोबाईल:</strong> ${job.phone}</p>
                                <p><strong>स्थान:</strong> ${job.district} | <strong>माहिती:</strong> ${job.desc}</p>
                            </div>
                            <div>
                                <button onclick="approveJob(${job.id})" class="approve-btn">✓ Approve</button>
                                <button onclick="deleteJob(${job.id})" class="reject-btn">✗ Reject</button>
                            </div>
                        </div>
                    `;
                }
            });

            if (!hasPending && isAdminLoggedIn) {
                pendingJobsDiv.innerHTML = '<p>कोणतेही पेंडिंग जॉब्स नाहीत.</p>';
            }
        }

        // एडमिन लॉगिन (पासवर्ड: admin123)
        function toggleAdmin() {
            if (!isAdminLoggedIn) {
                let password = prompt("कृपया एडमिन पासवर्ड टाका:");
                if (password === "admin123") {
                    isAdminLoggedIn = true;
                    document.getElementById('admin-panel').style.display = 'block';
                    alert("एडमिन लॉगिन यशस्वी!");
                    renderJobs();
                } else {
                    alert("चुकीचा पासवर्ड!");
                }
            } else {
                isAdminLoggedIn = false;
                document.getElementById('admin-panel').style.display = 'none';
                renderJobs();
            }
        }

        // जॉब मंजुरी (Approve)
        function approveJob(id) {
            jobs = jobs.map(j => j.id === id ? {...j, status: 'approved'} : j);
            localStorage.setItem('jobDhundData', JSON.stringify(jobs));
            renderJobs();
        }

        // जॉब डिलीट / रिजेक्ट करणे
        function deleteJob(id) {
            jobs = jobs.filter(j => j.id !== id);
            localStorage.setItem('jobDhundData', JSON.stringify(jobs));
            renderJobs();
        }

        // सुरुवातीला जॉब्स लोड करा
        renderJobs();
    </script>
</body>
</html>
